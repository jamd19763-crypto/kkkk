name: ✅ FINAL SIMPLE APK (100% Working)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 1. فك ضغط الـ ZIP (إن وجد)
      # -----------------------------------------------------------------
      - name: Extract ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ARCHIVE" ]; then
            echo "Extracting $ARCHIVE"
            unzip -o "$ARCHIVE" -d ./
            rm -f "$ARCHIVE"
          fi

      # -----------------------------------------------------------------
      # 2. تجهيز Java 17 (الإصدار الأكثر استقرارًا لـ Android)
      # -----------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # -----------------------------------------------------------------
      # 3. إنشاء المشروع من الصفر (بدون أي تعقيدات)
      # -----------------------------------------------------------------
      - name: Create Minimal Android Project
        run: |
          echo "🚀 Creating clean Android project..."

          # حذف أي ملفات قديمة
          rm -rf app build.gradle settings.gradle

          # ------------------------------------------------------------
          # 1) settings.gradle
          # ------------------------------------------------------------
          cat <<'EOF' > settings.gradle
          include ':app'
          rootProject.name = "DialerApp"
          EOF

          # ------------------------------------------------------------
          # 2) build.gradle (project level)
          # ------------------------------------------------------------
          cat <<'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ------------------------------------------------------------
          # 3) app/build.gradle (very simple)
          # ------------------------------------------------------------
          mkdir -p app
          cat <<'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }

          android {
              namespace 'com.dialer.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.dialer.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          touch app/proguard-rules.pro

          # ------------------------------------------------------------
          # 4) gradle.properties
          # ------------------------------------------------------------
          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # ------------------------------------------------------------
          # 5) Source files (no special characters in XML)
          # ------------------------------------------------------------
          mkdir -p app/src/main/java/com/dialer/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # AndroidManifest.xml (with call recording permissions)
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.dialer.app">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.DIAL" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <action android:name="android.intent.action.DIAL" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="tel" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml (simple text without any special characters)
          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Dialer App</string>
          </resources>
          EOF

          # activity_main.xml (NO "&" or any special characters)
          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="#1C1B1F">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Dialer App Ready"
                  android:textColor="#FFFFFF"
                  android:textSize="28sp"
                  android:fontFamily="sans-serif-light" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Call Recorder + Dialer"
                  android:textColor="#A8C8FB"
                  android:textSize="16sp"
                  android:layout_marginTop="8dp" />

          </LinearLayout>
          EOF

          # MainActivity.kt (very simple)
          cat <<'EOF' > app/src/main/java/com/dialer/app/MainActivity.kt
          package com.dialer.app

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF

          echo "✅ Project created successfully!"
          echo "📁 Structure:"
          find . -type f

      # -----------------------------------------------------------------
      # 4. Generate Debug Keystore
      # -----------------------------------------------------------------
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,OU=Dev,O=Dialer,C=EG" || true
          cp debug.keystore app/debug.keystore || true

      # -----------------------------------------------------------------
      # 5. Build APK
      # -----------------------------------------------------------------
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      # -----------------------------------------------------------------
      # 6. Upload APK
      # -----------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DialerApp-Working-APK
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 7
          if-no-files-found: error
