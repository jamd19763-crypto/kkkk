# ====================================================================
#  UNIVERSAL ANDROID ARCHIVE COMPILER - AUTO-HEAL EDITION (FIXED)
# ====================================================================
name: Android APK Builder (Auto-Heal)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.parallel=false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 1. فك الضغط عن أي ملف ZIP موجود (مثل ملفك الذي أنشأه الذكاء)
      # -----------------------------------------------------------------
      - name: Extract ZIP Archive
        run: |
          ARCHIVE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ARCHIVE" ]; then
            echo "📦 Extracting $ARCHIVE"
            unzip -o "$ARCHIVE" -d ./
            rm -f "$ARCHIVE"
          fi

      # -----------------------------------------------------------------
      # 2. تثبيت Java 21 (متوافق مع Gradle 9.x)
      # -----------------------------------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # -----------------------------------------------------------------
      # 3. ترقية Gradle Wrapper إلى 9.3.1 (للتأكد من التوافق)
      # -----------------------------------------------------------------
      - name: Upgrade Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          else
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          chmod +x gradlew

      # -----------------------------------------------------------------
      # 4. 🧠 التصحيح الذكي (Auto-Heal) - هذه هي الخطوة السحرية التي تحل مشكلتك
      # -----------------------------------------------------------------
      - name: Auto-Heal build.gradle.kts files
        run: |
          echo "🔧 بدء عملية التصحيح التلقائي لملفات البناء..."
          
          # البحث عن جميع ملفات build.gradle.kts (تجنب مجلدات build)
          find . -name "build.gradle.kts" -not -path "*/build/*" | while read -r file; do
            echo "🛠️  تصحيح الملف: $file"
            
            # استبدال alias(libs.plugins.android.application) بالصيغة الثابتة
            sed -i 's/alias(libs.plugins.android.application)/id("com.android.application") version "8.7.2"/g' "$file"
            
            # استبدال alias(libs.plugins.kotlin.compose) أو kotlin.android
            sed -i 's/alias(libs.plugins.kotlin.compose)/id("org.jetbrains.kotlin.android") version "2.1.0"/g' "$file"
            sed -i 's/alias(libs.plugins.kotlin.android)/id("org.jetbrains.kotlin.android") version "2.1.0"/g' "$file"
            
            # استبدال alias(libs.plugins.google.devtools.ksp)
            sed -i 's/alias(libs.plugins.google.devtools.ksp)/id("com.google.devtools.ksp") version "2.1.0-1.0.29"/g' "$file"
            
            # استبدال alias(libs.plugins.google.services) (خاص بخدمات Google Play)
            sed -i 's/alias(libs.plugins.google.services)/id("com.google.gms.google-services") version "4.4.2"/g' "$file"
            
            # استبدال alias(libs.plugins.roborazzi) لو وجد
            sed -i 's/alias(libs.plugins.roborazzi)/id("io.github.takahirom.roborazzi") version "1.28.0"/g' "$file"
            
            # استبدال alias(libs.plugins.secrets) لو وجد
            sed -i 's/alias(libs.plugins.secrets)/id("com.google.android.libraries.mapsplatform.secrets-gradle-plugin") version "2.0.1"/g' "$file"
            
            echo "✅ تم تصحيح $file بنجاح"
          done

          # البحث عن ملفات build.gradle (القديمة) وتصحيحها أيضاً
          find . -name "build.gradle" -not -path "*/build/*" | while read -r file; do
            echo "🛠️  تصحيح (Gradle القديم): $file"
            sed -i 's/classpath "com.android.tools.build:gradle:.*"/classpath "com.android.tools.build:gradle:8.7.2"/g' "$file"
            sed -i 's/classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:.*"/classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"/g' "$file"
          done

      # -----------------------------------------------------------------
      # 5. إضافة ملف gradle.properties لتسريع البناء وتفادي أخطاء الذاكرة
      # -----------------------------------------------------------------
      - name: Inject gradle.properties
        run: |
          cat <<EOF > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.incremental=false
          org.gradle.parallel=false
          org.gradle.caching=false
          EOF

      # -----------------------------------------------------------------
      # 6. التوقيع الرقمي (Keystore Debug)
      # -----------------------------------------------------------------
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,OU=Dev,O=Hamo,C=EG" || true
          mkdir -p app
          cp debug.keystore app/debug.keystore || true

      # -----------------------------------------------------------------
      # 7. منح صلاحيات التنفيذ وبدء التجميع
      # -----------------------------------------------------------------
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # -----------------------------------------------------------------
      # 8. رفع ملف APK النهائي
      # -----------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fixed-Zenith-Dialer-APK
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 7
          if-no-files-found: error
