name: 🏆 Final Working APK (Simple XML - No Compose)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 1. فك ضغط الـ ZIP (إن وجد)
      # -----------------------------------------------------------------
      - name: 📦 Extract ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ARCHIVE" ]; then
            echo "📦 Extracting $ARCHIVE"
            unzip -o "$ARCHIVE" -d ./
            rm -f "$ARCHIVE"
          fi

      # -----------------------------------------------------------------
      # 2. تجهيز Java 21
      # -----------------------------------------------------------------
      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # -----------------------------------------------------------------
      # 3. توليد Gradle Wrapper
      # -----------------------------------------------------------------
      - name: 🔧 Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew

      # ================================================================
      # 🧠 بناء مجلدات المشروع من الصفر (بدون Compose)
      # ================================================================
      - name: 🏗️ Generate Simple Android Project (No Compose)
        run: |
          echo "🚀 إنشاء مشروع Android بسيط (XML + Groovy)..."

          # حذف أي ملفات قديمة
          rm -rf app build.gradle settings.gradle

          # ------------------------------------------------------------
          # 1) settings.gradle (Groovy)
          # ------------------------------------------------------------
          cat <<'EOF' > settings.gradle
          include ':app'
          rootProject.name = "ZenithDialer"
          EOF

          # ------------------------------------------------------------
          # 2) build.gradle (المشروع)
          # ------------------------------------------------------------
          cat <<'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ------------------------------------------------------------
          # 3) app/build.gradle (Groovy - بدون Compose)
          # ------------------------------------------------------------
          mkdir -p app
          cat <<'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }

          android {
              namespace 'com.zenith.dialer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.zenith.dialer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          # ------------------------------------------------------------
          # 4) ملف proguard-rules.pro فارغ
          # ------------------------------------------------------------
          touch app/proguard-rules.pro

          # ------------------------------------------------------------
          # 5) gradle.properties
          # ------------------------------------------------------------
          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # ------------------------------------------------------------
          # 6) ملفات المصدر (MainActivity + Layout + Manifest)
          # ------------------------------------------------------------
          mkdir -p app/src/main/java/com/zenith/dialer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # AndroidManifest.xml (مع كل صلاحيات التسجيل والمكالمات)
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.zenith.dialer">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.DIAL" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <action android:name="android.intent.action.DIAL" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="tel" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Zenith Dialer</string>
          </resources>
          EOF

          # activity_main.xml (واجهة بسيطة)
          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="#1C1B1F">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="✨ Zenith Dialer Ready"
                  android:textColor="#FFFFFF"
                  android:textSize="28sp"
                  android:fontFamily="sans-serif-light" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Call Recording & Dialer"
                  android:textColor="#A8C8FB"
                  android:textSize="16sp"
                  android:layout_marginTop="8dp" />

          </LinearLayout>
          EOF

          # MainActivity.kt (بدون Compose، يستخدم XML)
          cat <<'EOF' > app/src/main/java/com/zenith/dialer/MainActivity.kt
          package com.zenith.dialer

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF

          echo "✅ تم إنشاء المشروع البسيط بنجاح (بدون Compose)!"
          echo "📁 هيكل المشروع:"
          find . -type f

      # -----------------------------------------------------------------
      # 4. توليد مفتاح التوقيع
      # -----------------------------------------------------------------
      - name: 🔑 Generate Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,OU=Dev,O=Zenith,C=EG" || true
          cp debug.keystore app/debug.keystore || true

      # -----------------------------------------------------------------
      # 5. 🛠️ البناء (هنا سينجح حتمًا)
      # -----------------------------------------------------------------
      - name: 🛠️ Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      # -----------------------------------------------------------------
      # 6. 📤 رفع الـ APK
      # -----------------------------------------------------------------
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Dialer-Working-APK
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 7
          if-no-files-found: error
