name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # في حال قام المستخدم برفع ملف الـ ZIP مباشرة إلى مستودع GitHub بدون فك الضغط
      - name: Auto-extract ZIP if uploaded directly
        run: |
          ZIP_COUNT=$(ls -1 *.zip 2>/dev/null | wc -l)
          if [ "$ZIP_COUNT" -gt 0 ]; then
            echo "Found ZIP file(s) in repository. Unzipping..."
            for f in *.zip; do
              unzip -o "$f" || true
            done
            # إذا تم فك الضغط داخل مجلد فرعي يحتوي على app و build.gradle.kts، انقل الملفات للجذر
            if [ ! -f "build.gradle.kts" ]; then
              SUB_DIR=$(find . -maxdepth 3 -name "build.gradle.kts" | head -n 1)
              if [ -n "$SUB_DIR" ]; then
                PARENT_DIR=$(dirname "$SUB_DIR")
                echo "Moving files from $PARENT_DIR to repository root..."
                cp -rn "$PARENT_DIR"/* . || true
              fi
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # التأكد من وجود ملفات البيئة ومفتاح التوقيع debug.keystore
      - name: Prepare Keystore and Environment Files
        run: |
          # تجهيز ملف .env إذا لم يكن موجوداً
          [ -f .env ] || touch .env

          # تجهيز debug.keystore من base64 أو توليده تلقائياً
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating new debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android \
                -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      # التأكد من وجود أداة Gradle Wrapper وصلاحيات التشغيل
      - name: Ensure Gradle Wrapper is executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Gradlew not found, setting up gradle wrapper..."
            gradle wrapper || true
          fi
          chmod +x gradlew || true

      # بناء ملف الـ APK بصيغة Debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # رفع ملف الـ APK الناتج كـ Artifact لتنزيله فوراً
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellTowerRadar-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

