name: 🏆 THE FINAL SOLUTION (Official Template)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 1. استخراج ZIP (ونتجاهله)
      # -----------------------------------------------------------------
      - name: Extract ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ARCHIVE" ]; then
            echo "📦 Extracting $ARCHIVE"
            unzip -o "$ARCHIVE" -d ./
            rm -f "$ARCHIVE"
          fi

      # -----------------------------------------------------------------
      # 2. Java 17
      # -----------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # -----------------------------------------------------------------
      # 3. 🎯 استخدام قالب Android الرسمي (الحل السحري)
      # -----------------------------------------------------------------
      - name: Create project using official Android template
        run: |
          echo "🚀 Creating project from official template..."

          # حذف كل شيء قديم
          rm -rf app build.gradle settings.gradle gradle gradlew gradlew.bat .gradle build

          # ------------------------------------------------------------
          # تحميل القالب الرسمي من Google
          # ------------------------------------------------------------
          git clone --depth 1 https://github.com/android/architecture-components-samples.git temp_repo
          cp -r temp_repo/BasicRxJavaSample/app ./
          cp -r temp_repo/BasicRxJavaSample/gradle ./
          cp -r temp_repo/BasicRxJavaSample/build.gradle ./
          cp -r temp_repo/BasicRxJavaSample/settings.gradle ./
          cp -r temp_repo/BasicRxJavaSample/gradle.properties ./
          cp -r temp_repo/BasicRxJavaSample/gradlew ./
          cp -r temp_repo/BasicRxJavaSample/gradlew.bat ./
          rm -rf temp_repo

          # تعديل اسم التطبيق
          sed -i 's/BasicRxJavaSample/DialerApp/g' settings.gradle
          sed -i 's/com.example.android.basicrxjavasample/com.dialer.app/g' app/build.gradle

          # إضافة صلاحيات التسجيل والمكالمات
          cat <<'EOF' >> app/src/main/AndroidManifest.xml
          <!-- إضافة صلاحيات التسجيل والمكالمات -->
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.READ_PHONE_STATE" />
          <uses-permission android:name="android.permission.READ_CONTACTS" />
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
          <uses-permission android:name="android.permission.USE_BIOMETRIC" />
          EOF

          chmod +x gradlew
          echo "✅ Project created from official template!"

      # -----------------------------------------------------------------
      # 4. البناء
      # -----------------------------------------------------------------
      - name: Build APK
        run: |
          echo "🔨 Building APK..."
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          echo "✅ Build completed!"

      # -----------------------------------------------------------------
      # 5. التحقق من الـ APK
      # -----------------------------------------------------------------
      - name: Find and upload APK
        run: |
          echo "🔍 Looking for APK..."
          find . -name "*.apk" -type f -exec ls -la {} \;
          APK_COUNT=$(find . -name "*.apk" -type f | wc -l)
          echo "Found $APK_COUNT APK files"

      # -----------------------------------------------------------------
      # 6. رفع الـ APK
      # -----------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DialerApp-APK
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 7
          if-no-files-found: error
