name: ✅ Ultimate Android APK Builder (Clean Sheet)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.parallel=false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 1. فك الضغط عن ملف ZIP (الخاص بـ AI Studio)
      # ----------------------------------------------------------------
      - name: 📦 Extract ZIP Archive
        run: |
          ARCHIVE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ARCHIVE" ]; then
            echo "📦 Extracting $ARCHIVE"
            unzip -o "$ARCHIVE" -d ./
            rm -f "$ARCHIVE"
          fi

      # ----------------------------------------------------------------
      # 2. تجهيز Java 21
      # ----------------------------------------------------------------
      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # ----------------------------------------------------------------
      # 3. توليد Gradle Wrapper جديد (للتأكد من التوافق)
      # ----------------------------------------------------------------
      - name: 🔧 Setup Gradle Wrapper 9.3.1
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          else
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          chmod +x gradlew

      # ================================================================
      # 🔥🔥🔥 المرحلة السحرية: حذف الملفات القديمة وكتابة ملفات صحيحة من الصفر
      # ================================================================
      - name: 🧹 Clean & Rewrite Gradle files from scratch
        run: |
          echo "🚀 بدء إعادة كتابة ملفات البناء بشكل كامل ونظيف..."

          # حذف الملفات القديمة الخاطئة (إن وجدت)
          rm -f build.gradle.kts
          rm -f app/build.gradle.kts
          rm -f settings.gradle.kts

          # ------------------------------------------------------------
          # كتابة ملف settings.gradle.kts
          # ------------------------------------------------------------
          cat <<'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "ZenithDialer"
          include(":app")
          EOF

          # ------------------------------------------------------------
          # كتابة ملف build.gradle.kts (المشروع الرئيسي)
          # ------------------------------------------------------------
          cat <<'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              // Plugin Compose الرسمي لـ Kotlin 2.0 (اللي كان ناقص)
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          EOF

          # ------------------------------------------------------------
          # كتابة ملف app/build.gradle.kts (التطبيق) - صحيح 100%
          # ------------------------------------------------------------
          mkdir -p app
          cat <<'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose") // هذا هو المطلوب لـ Compose 2.0
          }

          android {
              namespace = "com.zenith.dialer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.zenith.dialer"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              // تفعيل Compose بالطريقة الصحيحة
              buildFeatures {
                  compose = true
              }

              // إعدادات Compose Compiler المتوافقة مع Kotlin 2.1.0
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              // Core Android
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")

              // Compose BOM (إدارة الإصدارات)
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")

              // مكتبات الهاتف والتسجيل (الخاصة بالمشروع الأصلي)
              implementation("androidx.telecom:telecom:1.0.0")
              implementation("androidx.core:core-role:1.0.0")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")

              // (اختياري) دعم Biometric للقفل
              implementation("androidx.biometric:biometric:1.1.0")

              // تصحيح الأخطاء والاختبار
              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
          }
          EOF

          # ------------------------------------------------------------
          # إنشاء ملف empty proguard-rules.pro حتى لا يشتكي
          # ------------------------------------------------------------
          touch app/proguard-rules.pro

          # ------------------------------------------------------------
          # كتابة ملف gradle.properties لتسريع البناء
          # ------------------------------------------------------------
          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.incremental=false
          org.gradle.parallel=false
          org.gradle.caching=false
          EOF

          echo "✅ تم كتابة جميع ملفات البناء من الصفر بنجاح!"
          echo "📁 محتويات المجلد الحالي:"
          ls -la
          echo "📁 محتويات مجلد التطبيق:"
          ls -la app/

      # ----------------------------------------------------------------
      # 4. توليد مفتاح التوقيع Debug
      # ----------------------------------------------------------------
      - name: 🔑 Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,OU=Dev,O=Zenith,C=EG" || true
          cp debug.keystore app/debug.keystore || true

      # ----------------------------------------------------------------
      # 5. بدء البناء الفعلي
      # ----------------------------------------------------------------
      - name: 🛠️ Build APK
        run: |
          chmod +x gradlew
          echo "🧹 تنظيف المشروع..."
          ./gradlew clean --no-daemon
          echo "📦 تجميع الـ APK (Debug)..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ----------------------------------------------------------------
      # 6. رفع الـ APK المنتج
      # ----------------------------------------------------------------
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Dialer-Final-APK
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 7
          if-no-files-found: error
